'use strict';

// =========================================================================
// Tangga 02: AI Tools Mastery — ipad-sketch Canvas 2D Engine (1080x1920, 30fps)
// =========================================================================
const W = 1080, H = 1920, FPS = 30, FULL = 133.094;

window.HEIGHT = H;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- World sheet domain & 1.4x buffer resolution ----------
const X0 = -80, Y0 = 100, DW = 1560, DH = 2800, S = 1.4;
const BW = Math.round(DW * S);  // 2184
const BH = Math.round(DH * S);  // 3920
const PX = x => (x - X0) * S;
const PY = y => (y - Y0) * S;

// ---------- Curated Tangga 02 Ink & Wash Palette ----------
const C = {
  paper: '#f3eadb',
  graphite: '#43362e',
  light: '#a8998a',
  coral: '#dc6a4c',
  mustard: '#f1c04f',
  teal: '#5f8f8b',
  terracotta: '#d47a5b',
  sky: '#6a8fb5',
  purple: '#8e6a9e',
  sage: '#7aa38b',
  mint: '#a7c6a0',
  creamDark: '#e4d6bd',
  inkSoft: '#6a5a4e',
  mentorTeal: '#2e5a62',
};

const hex = c => [
  parseInt(c.slice(1, 3), 16) / 255,
  parseInt(c.slice(3, 5), 16) / 255,
  parseInt(c.slice(5, 7), 16) / 255,
];

// ---------- Seeded determinism & noise ----------
function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = mulberry(20261122);
const rnd = (a = 0, b = 1) => a + (b - a) * R();

function h2(x, y) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

const n1 = (s, seed) => vn(s, seed * 13.7);
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => {
  t = clamp(t);
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
};
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const sstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const gease = u => 0.45 * eio(u) + 0.55 * eo(u);
const TAU = Math.PI * 2;

// =========================================================================
// Fast Dedicated Cover (?thumb=1) — crisp renders within <50ms for --thumb

function drawCoverFrame() {

  ctx.lineWidth = 2;
  ctx.setLineDash([12, 10]);

  const paintBlob = (x, y, w, h, r, col, dx = 8, dy = 7) => {

  ctx.fill();
  ctx.strokeStyle = C.graphite;

  ctx.fillStyle = C.graphite;
  ctx.font = '800 38px PJEB, sans-serif';
  ctx.fillText('4 JURUS BIAR AI', W / 2, 1326);

  // Radial vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.15);
  g.addColorStop(0, 'rgba(120,100,80,0)');

}

// =========================================================================
// Full Paper Grain & Compositing Buffers
// =========================================================================
let GRAIN, GRAIN2, PP_R, PP_G, PP_B;
function buildGrain() {
  const N = BW * BH;
  const wn = new Float32Array(N);
  const tmp = new Float32Array(N);
  GRAIN = new Float32Array(N);
  GRAIN2 = new Float32Array(N);
  PP_R = new Float32Array(N);
  PP_G = new Float32Array(N);
  PP_B = new Float32Array(N);
  const GK = 1.5 / S;
  const pp = hex(C.paper);

  for (let i = 0; i < N; i++) {
    wn[i] = h2(Math.floor((i % BW) * GK) * 3 + 11, Math.floor(((i / BW) | 0) * GK) * 7 + 5);
  }
  for (let y = 0; y < BH; y++) {
    const o = y * BW;
    for (let x = 0; x < BW; x++) {
      tmp[o + x] = (wn[o + Math.max(0, x - 1)] + wn[o + x] + wn[o + Math.min(BW - 1, x + 1)]) / 3;
    }
  }
  for (let y = 0; y < BH; y++) {
    const a = Math.max(0, y - 1) * BW, b = y * BW, c = Math.min(BH - 1, y + 1) * BW;
    for (let x = 0; x < BW; x++) {
      const fine = (tmp[a + x] + tmp[b + x] + tmp[c + x]) / 3;
      const gx = x * GK, gy = y * GK;
      GRAIN[b + x] = 0.45 * fine * 1.6 - 0.22 + 0.35 * vn(gx / 2.3 + (gy * 0.35) / 2.3, gy / 1.6) + 0.2 * vn(gx / 7, gy / 7);
      GRAIN2[b + x] = vn(gx / 90, gy / 90) * 0.6 + vn(gx / 23, gy / 23) * 0.4;
    }
  }
  let m = 0, v = 0, cnt = 0;
  for (let i = 0; i < N; i += 7) { m += GRAIN[i]; cnt++; }
  m /= cnt;
  for (let i = 0; i < N; i += 7) v += (GRAIN[i] - m) ** 2;
  v = Math.sqrt(v / cnt) || 1;
  for (let i = 0; i < N; i++) {
    const g = clamp(0.5 + ((GRAIN[i] - m) / v) * 0.2);
    GRAIN[i] = g;
    const g2 = GRAIN2[i];
    const pk = (0.985 + 0.03 * g2) * (0.99 + 0.02 * g);
    PP_R[i] = pp[0] * pk;
    PP_G[i] = pp[1] * pk;
    PP_B[i] = pp[2] * (0.985 + 0.03 * g2) * (0.985 + 0.025 * g);
  }
}

// ---------- Drawing targets: 3 pencil coverage layers + colour canvas ----------
const LAYERS = {
  light: { col: hex(C.light), alpha: 0.55 },
  graph: { col: hex(C.graphite), alpha: 0.95 },
  coral: { col: hex(C.coral), alpha: 0.95 },
};
const ORDER = ['light', 'graph', 'coral'];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}
function mkTarget() {
  const fc = mkCanvas(BW, BH);
  return {
    L: {

let CACHE = null, WORK = null, TG = null, cacheK = 0;
const WC = mkCanvas(BW, BH), wx = WC.getContext('2d');
const TMP = mkCanvas(900, 900), tx = TMP.getContext('2d', { willReadFrequently: true });
const TMP2 = mkCanvas(900, 900), tx2 = TMP2.getContext('2d');
function tmpSize(c, w, h) {
  if (c.width < w || c.height < h) {
    c.width = Math.max(c.width, w);
    c.height = Math.max(c.height, h);

}

// =========================================================================
// Geometry Helpers
// =========================================================================
function spline(P, step = 2) {
  if (P.length < 2) return P.slice();
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const n = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      ]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}

function resample(P, step) {
  const out = [P[0].slice()];
  let acc = 0;
  for (let i = 1; i < P.length; i++) {
    let [x0, y0] = P[i - 1];
    const [x1, y1] = P[i];
    let d = Math.hypot(x1 - x0, y1 - y0);
    while (acc + d >= step) {
      const t = (step - acc) / d;
      x0 += (x1 - x0) * t;
      y0 += (y1 - y0) * t;
      out.push([x0, y0]);
      d = Math.hypot(x1 - x0, y1 - y0);
      acc = 0;
    }
    acc += d;
  }
  return out;
}

function ell(cx, cy, rx, ry, rot = 0, a0 = 0, a1 = TAU, n = 48, wob = 0) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = a0 + ((a1 - a0) * i) / n, k = 1 + wob * Math.sin(2 * a);
    const x = rx * Math.cos(a) * k, y = ry * Math.sin(a) * k;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}

function bez(p0, p1, p2, p3, n = 22) {
  const P = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    P.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ]);
  }
  return P;
}

function roundedRectPts(x, y, w, h, r = 16, rot = 0) {
  r = Math.min(r, w / 2, h / 2);
  const P = [];
  const arc = (cx, cy, a0, a1, n = 5) => {
    for (let i = 0; i <= n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  };
  arc(x + w - r, y + r, -Math.PI / 2, 0);
  arc(x + w - r, y + h - r, 0, Math.PI / 2);
  arc(x + r, y + h - r, Math.PI / 2, Math.PI);
  arc(x + r, y + r, Math.PI, Math.PI * 1.5);
  if (rot) {
    const cx = x + w / 2, cy = y + h / 2, c = Math.cos(rot), s = Math.sin(rot);
    return P.map(([px, py]) => [cx + (px - cx) * c - (py - cy) * s, cy + (px - cx) * s + (py - cy) * c]);
  }
  return P;
}

function bbox(P) {
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (const [x, y] of P) {
    if (x < a) a = x;
    if (y < b) b = y;
    if (x > c) c = x;
    if (y > d) d = y;
  }
  return [a, b, c, d];
}

function centroid(P) {
  let x = 0, y = 0;
  for (const p of P) { x += p[0]; y += p[1]; }
  return [x / P.length, y / P.length];
}

function roughen(P, amp = 1.5) {
  const seed = rnd(0, 999), D = resample(P.concat([P[0]]), 3.5), N = D.length, out = [];
  for (let i = 0; i < N; i++) {
    const a = D[(i - 1 + N) % N], b = D[(i + 1) % N];
    let tx_ = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx_, ty) || 1;
    tx_ /= l;
    ty /= l;
    const s = i * 3.5;
    const off = amp * ((n1(s / 30, seed) - 0.5) * 1.6 + (n1(s / 4, seed + 5) - 0.5) * 0.9 + (h2(i, seed | 0) - 0.5) * 0.5);
    out.push([D[i][0] - ty * off, D[i][1] + tx_ * off]);
  }
  return out;
}

function plen(P) {
  let s = 0;
  for (let i = 1; i < P.length; i++) s += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  return s;
}

function along(P, d) {
  for (let i = 1; i < P.length; i++) {
    const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    if (d <= l) {
      const u = l ? d / l : 0;
      return [lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u)];
    }
    d -= l;
  }
  return P[P.length - 1].slice();
}

function polyPath(c, P, k = 1, ox = 0, oy = 0) {
  c.moveTo(P[0][0] * k + ox, P[0][1] * k + oy);
  for (let i = 1; i < P.length; i++) c.lineTo(P[i][0] * k + ox, P[i][1] * k + oy);
  c.closePath();
}

// =========================================================================
// Marks Timeline Primitives (PEN, BLOB, OCC, TXT)
// =========================================================================
const EL = [];
const DYN = [];
const SFX = [];

function addEl(e) {
  e.d = Math.max(e.d, 1 / FPS);
  if (e.ghost) {
    e.kind = 'none';
    delete e.nib;
  }
  EL.push(e);
  return e.t0 + e.d;
}

function PEN(pts, o, t0, d) {
  o = o || {};
  const lay = LAYERS[o.layer] ? o.layer : 'graph';
  const w = (o.w ?? 2.6) * 1.16;
  const wob = o.wob ?? 0.75, press = o.p ?? 1, ta = o.ta ?? 0.16, tb = o.tb ?? 0.20, seed = rnd(0, 999);
  let P = o.smooth === false ? pts : spline(pts, 2.2);
  P = resample(P, 0.65);
  if (P.length < 2) return t0;
  const N = P.length, tot = (N - 1) * 0.65, st = new Float32Array(N * 4), nib = [];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < N; i++) {
    const a = P[Math.max(0, i - 2)], b = P[Math.min(N - 1, i + 2)];
    let tx_ = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx_, ty) || 1;
    tx_ /= l;
    ty /= l;
    const s = i * 0.65;
    const off = wob * ((n1(s / 38, seed) - 0.5) * 2 + (n1(s / 9, seed + 3) - 0.5) * 0.5);
    const qx = P[i][0] - ty * off, qy = P[i][1] + tx_ * off;
    let p = Math.pow(clamp(s / (tot * ta + 1e-3)), 0.55) * Math.pow(clamp((tot - s) / (tot * tb + 1e-3)), 0.55);
    p = press * (0.14 + 0.86 * p) * (0.84 + 0.16 * n1(s / 22, seed + 7));
    const r = w * 0.5 * (0.5 + 0.5 * p) * S, cx = PX(qx), cy = PY(qy);
    st[i * 4] = cx; st[i * 4 + 1] = cy; st[i * 4 + 2] = r; st[i * 4 + 3] = 0.34 + 0.66 * p;
    x0 = Math.min(x0, cx - r); y0 = Math.min(y0, cy - r); x1 = Math.max(x1, cx + r); y1 = Math.max(y1, cy + r);
    if (i % 7 === 0 || i === N - 1) nib.push([qx, qy]);
  }
  const bx0 = Math.max(0, Math.floor(x0 - 2)), by0 = Math.max(0, Math.floor(y0 - 2));
  const bx1 = Math.min(BW - 1, Math.ceil(x1 + 2)), by1 = Math.min(BH - 1, Math.ceil(y1 + 2));
  const bw = bx1 - bx0 + 1, bh = by1 - by0 + 1;
  if (bw <= 0 || bh <= 0) return t0;

  return addEl({
    t0, d, ghost: o.ghost, kind: lay === 'light' ? 'light' : (o.kind || 'pencil'),
    wx: centroid(nib),
    nib: p => nib[Math.min(nib.length - 1, Math.floor(clamp(p) * (nib.length - 1)))],
    apply(prog) {
      const n = prog >= 1 ? N : Math.floor(prog * N);
      if (n < 2) return;
      const B = new Float32Array(bw * bh);
      for (let i = 0; i < n; i++) {
        const cx = st[i * 4] - bx0, cy = st[i * 4 + 1] - by0, r = st[i * 4 + 2], val = st[i * 4 + 3];
        const ix0 = Math.max(0, Math.floor(cx - r - 1)), ix1 = Math.min(bw - 1, Math.ceil(cx + r + 1));
        const iy0 = Math.max(0, Math.floor(cy - r - 1)), iy1 = Math.min(bh - 1, Math.ceil(cy + r + 1));
        for (let y = iy0; y <= iy1; y++) {
          const dy = y + 0.5 - cy, row = y * bw;
          for (let x = ix0; x <= ix1; x++) {
            const dx = x + 0.5 - cx, cov = r - Math.sqrt(dx * dx + dy * dy) + 0.5;
            if (cov <= 0) continue;
            const v = (cov > 1 ? 1 : cov) * val;
            if (v > B[row + x]) B[row + x] = v;
          }
        }
      }
      const buf = TG.L[lay];
      for (let y = 0; y < bh; y++) {
        const row = y * bw, o_ = (y + by0) * BW + bx0;
        for (let x = 0; x < bw; x++) {
          const v = B[row + x];
          if (v) { const k = o_ + x; buf[k] = buf[k] + v - buf[k] * v; }
        }
      }
    },
  });
}

function OCC(poly, t0, names = ['light', 'graph', 'coral'], fills = true) {
  const P = poly.map(([x, y]) => [PX(x), PY(y)]), [a, b, c, d] = bbox(P);
  const x0 = Math.max(0, Math.floor(a) - 1), y0 = Math.max(0, Math.floor(b) - 1);
  const x1 = Math.min(BW, Math.ceil(c) + 1), y1 = Math.min(BH, Math.ceil(d) + 1);
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return t0;
  tmpSize(TMP, w, h); tx.clearRect(0, 0, w, h); tx.fillStyle = '#fff';
  tx.beginPath(); polyPath(tx, P, 1, -x0, -y0); tx.fill();
  const id = tx.getImageData(0, 0, w, h).data, M = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) M[i] = id[i * 4 + 3] / 255;
  return addEl({
    t0, d: 1 / FPS, kind: 'occ',
    apply() {
      for (const nm of names) {
        const buf = TG.L[nm];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const m = M[y * w + x];
            if (m) buf[(y + y0) * BW + x + x0] *= 1 - m;
          }
        }
      }
      if (fills) {
        TG.fx.save();
        TG.fx.globalCompositeOperation = 'destination-out';
        TG.fx.beginPath();
        polyPath(TG.fx, P);
        TG.fx.fill();
        TG.fx.restore();
      }
    },
  });
}

function BLOB(poly, col, o, t0, d) {
  o = o || {};
  const dx = o.dx ?? 7, dy = o.dy ?? 5;
  const Q = roughen(poly.map(([x, y]) => [x + dx, y + dy]), o.amp ?? 1.4);
  const holes = (o.holes || []).map(h => h.map(([x, y]) => [x + dx, y + dy]));
  const cuts = o.cuts || [];
  const [a, b, c, e] = bbox(Q);
  const ang = o.ang ?? -0.5, sp = o.sp ?? 10, ca = Math.cos(ang), sa = Math.sin(ang);
  const RQ = Q.map(([x, y]) => [x * ca + y * sa, -x * sa + y * ca]), [, rb, , re] = bbox(RQ);
  const path = [];
  let dir = 1, rows = 0;
  for (let v = rb + sp * 0.5; v < re; v += sp) {
    let lo = 1e9, hi = -1e9;
    for (let i = 0; i < RQ.length; i++) {
      const p = RQ[i], q = RQ[(i + 1) % RQ.length];
      if ((p[1] - v) * (q[1] - v) <= 0 && p[1] !== q[1]) {
        const u = (v - p[1]) / (q[1] - p[1]), x = p[0] + (q[0] - p[0]) * u;
        lo = Math.min(lo, x); hi = Math.max(hi, x);
      }
    }
    if (lo > hi) continue;
    const ends = dir > 0 ? [lo - 2 + rnd(-3, 2), hi + 2 + rnd(-2, 3)] : [hi + 2 + rnd(-2, 3), lo - 2 + rnd(-3, 2)];
    for (const u of ends) path.push([u * ca - v * sa, u * sa + v * ca]);
    dir = -dir; rows++;
  }
  const L = plen(path), stop = o.stop ?? 1, alpha = o.a ?? 0.90;
  const x0 = Math.max(0, Math.floor(PX(a) - 6)), y0 = Math.max(0, Math.floor(PY(b) - 6));
  const x1 = Math.min(BW, Math.ceil(PX(c) + 6)), y1 = Math.min(BH, Math.ceil(PY(e) + 6));
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return t0;
  const toT = P => P.map(([x, y]) => [PX(x) - x0, PY(y) - y0]);
  const QT = toT(Q), HT = holes.map(toT), CT = cuts.map(toT), PT = toT(path);

  return addEl({
    t0, d, ghost: o.ghost, kind: 'color', rate: rows / Math.max(d, 0.05), wx: [(a + c) / 2, (b + e) / 2], stop,
    nib: p => (path.length ? along(path, clamp(p) * stop * L) : [(a + c) / 2, (b + e) / 2]),
    apply(prog) {
      const pr = clamp(prog) * stop;
      if (pr <= 0) return;
      tmpSize(TMP, w, h); tx.clearRect(0, 0, w, h);
      tx.save(); tx.globalCompositeOperation = 'source-over'; tx.fillStyle = col;
      tx.beginPath(); polyPath(tx, QT); tx.fill();
      tx.globalCompositeOperation = 'destination-out'; tx.fillStyle = '#000';
      for (const P of HT.concat(CT)) { tx.beginPath(); polyPath(tx, P); tx.fill(); }
      if (pr < 1 && PT.length) {
        tx.globalCompositeOperation = 'destination-in'; tx.lineCap = 'round'; tx.lineJoin = 'round';
        tx.lineWidth = sp * 1.9 * S; tx.strokeStyle = '#000';
        tx.beginPath();
        let left = pr * L;
        tx.moveTo(PT[0][0], PT[0][1]);
        for (let i = 1; i < PT.length && left > 0; i++) {
          const l = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
          const u = Math.min(1, left / (l || 1));
          tx.lineTo(lerp(PT[i - 1][0], PT[i][0], u), lerp(PT[i - 1][1], PT[i][1], u));
          left -= l;
        }
        tx.stroke();
      }
      tx.restore();

      if (o.replace) {
        tmpSize(TMP2, w, h); tx2.setTransform(1, 0, 0, 1, 0, 0); tx2.clearRect(0, 0, w, h); tx2.save();
        tx2.fillStyle = '#000'; tx2.strokeStyle = '#000'; tx2.lineWidth = 8 * S; tx2.lineJoin = 'round';
        tx2.beginPath(); polyPath(tx2, QT); tx2.fill(); tx2.stroke();
        tx2.globalCompositeOperation = 'destination-out';
        for (const P of CT) { tx2.beginPath(); polyPath(tx2, P); tx2.fill(); }
        if (pr < 1 && PT.length) {
          tx2.globalCompositeOperation = 'destination-in'; tx2.lineCap = 'round'; tx2.lineJoin = 'round';
          tx2.lineWidth = sp * 1.9 * S;
          tx2.beginPath();
          let left = pr * L;
          tx2.moveTo(PT[0][0], PT[0][1]);
          for (let i = 1; i < PT.length && left > 0; i++) {
            const l = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
            const u = Math.min(1, left / (l || 1));
            tx2.lineTo(lerp(PT[i - 1][0], PT[i][0], u), lerp(PT[i - 1][1], PT[i][1], u));
            left -= l;
          }
          tx2.stroke();
        }
        tx2.restore();
        const f0 = TG.fx;
        f0.save(); f0.globalCompositeOperation = 'destination-out';
        f0.drawImage(TMP2, 0, 0, w, h, x0, y0, w, h);
        f0.restore();
      }
      const f = TG.fx;
      f.save();
      f.globalCompositeOperation = o.blend || 'multiply';
      f.globalAlpha = alpha;
      f.drawImage(TMP, 0, 0, w, h, x0, y0, w, h);
      f.restore();
    },
  });
}

// ---------- Pencil lettering along glyph skeletons ----------
let GLY = null;
const mctx = mkCanvas(10, 10).getContext('2d');

function textLayout(s, x, y, size, o = {}) {
  const f = o.f || 'CB', jit = o.jit ?? 0.55, rot = o.rot || 0, sp = o.sp ?? 1;
  mctx.font = `${size}px ${f}`;
  const ch = [...s], G = GLY[f];
  let cx = 0;
  const advs = ch.map(c => { const a = mctx.measureText(c).width * sp; cx += a; return a; });
  const tot = cx;
  if (o.align === 'center') x -= tot / 2;
  else if (o.align === 'right') x -= tot;

  cx = 0;
  let L = 0;
  const chars = [], c0 = Math.cos(rot), s0 = Math.sin(rot);
  ch.forEach((c, idx) => {
    const adv = advs[idx], dy = rnd(-1, 1) * jit * size * 0.022, r = rnd(-1, 1) * jit * 0.032;
    const cr = Math.cos(r), sr = Math.sin(r);
    const toW = (u, v) => {
      const lx = cx + u * cr - v * sr, ly = dy + u * sr + v * cr;
      return [x + lx * c0 - ly * s0, y + lx * s0 + ly * c0];
    };
    const sk = (G.g[c] || []).map(a => {
      const P = [];
      for (let j = 0; j < a.length; j += 2) P.push([a[j] * size, a[j + 1] * size]);
      return P;
    });
    const lens = sk.map(plen), len = lens.reduce((p, q) => p + q, 0) + sk.length * size * 0.11;
    const wsk = sk.map(P => P.map(([u, v]) => toW(u, v)));
    chars.push({ c, ox: cx, dy, r, sk, wsk, len: c === ' ' ? 0 : len, L0: L, adv });
    L += c === ' ' ? size * 0.25 : len;
    cx += adv;
  });
  return { s, x, y, size, f, rot, chars, L, hw: G.hw * size, tot };
}

function textNib(T, prog) {
  let target = clamp(prog) * T.L, last = [T.x, T.y];
  for (const Cc of T.chars) {
    if (!Cc.wsk.length) { target -= (Cc.c === ' ' ? T.size * 0.25 : 0); continue; }
    if (target <= Cc.len) {
      let left = target;
      for (let k = 0; k < Cc.wsk.length; k++) {
        const P = Cc.wsk[k], l = plen(P);
        if (left <= l) return along(P, left);
        left -= l;
        if (left <= T.size * 0.11) {
          const n = Cc.wsk[k + 1];
          return n ? along([P[P.length - 1], n[0]], (left / (T.size * 0.11)) * Math.hypot(n[0][0] - P[P.length - 1][0], n[0][1] - P[P.length - 1][1])) : P[P.length - 1];
        }
        left -= T.size * 0.11;
      }
      return last;
    }
    target -= Cc.len;
    const P = Cc.wsk[Cc.wsk.length - 1];
    last = P[P.length - 1];
  }
  return last;
}

function TXT(s, x, y, size, o, t0, d) {
  o = o || {};
  const T = textLayout(s, x, y, size, o), lay = o.layer || 'graph', k = o.k ?? 0.80;
  const x0 = Math.max(0, Math.floor(PX(T.x - size * 0.45)));
  const y0 = Math.max(0, Math.floor(PY(T.y - size * 1.25 - Math.abs(T.rot) * T.tot)));
  const x1 = Math.min(BW, Math.ceil(PX(T.x + T.tot + size * 0.55)));
  const y1 = Math.min(BH, Math.ceil(PY(T.y + size * 0.65 + Math.abs(T.rot) * T.tot)));
  const w = x1 - x0, h = y1 - y0;
  T.box = [T.x - size * 0.08, T.y - size * 0.82, T.x + T.tot + size * 0.06, T.y + size * 0.28];
  const dur = d ?? Math.max(0.28, T.L / (o.cps || 920));
  const e = {
    t0, d: dur, ghost: o.ghost, kind: 'write', T, pass: !!o.pass,
    wx: [T.x + T.tot / 2, T.y],
    nib: p => textNib(T, p),
    apply(prog) {
      if (w <= 0 || h <= 0) return;
      const target = clamp(prog) * T.L;
      if (target <= 0) return;
      tmpSize(TMP, w, h); tx.setTransform(1, 0, 0, 1, 0, 0); tx.clearRect(0, 0, w, h);
      const base = () => {
        tx.setTransform(S, 0, 0, S, -X0 * S - x0, -Y0 * S - y0);
        tx.translate(T.x, T.y);
        tx.rotate(T.rot);
      };
      tx.font = `${T.size}px ${T.f}`; tx.fillStyle = '#000'; tx.textBaseline = 'alphabetic';
      for (const Cc of T.chars) {
        if (Cc.L0 >= target) break;
        const part = target - Cc.L0;
        base(); tx.translate(Cc.ox, Cc.dy); tx.rotate(Cc.r);
        if (part >= Cc.len || !Cc.sk.length) {
          tx.fillText(Cc.c, 0, 0);
          continue;
        }
        tmpSize(TMP2, w, h); tx2.setTransform(1, 0, 0, 1, 0, 0); tx2.clearRect(0, 0, w, h);
        tx2.setTransform(tx.getTransform());
        tx2.font = tx.font; tx2.fillStyle = '#000'; tx2.textBaseline = 'alphabetic';
        tx2.fillText(Cc.c, 0, 0);
        tx2.globalCompositeOperation = 'destination-in'; tx2.lineCap = 'round'; tx2.lineJoin = 'round';
        tx2.lineWidth = T.hw * 3.0 + 1.4; tx2.strokeStyle = '#000';
        let left = part;
        tx2.beginPath();
        for (let q = 0; q < Cc.sk.length && left > 0; q++) {
          const P = Cc.sk[q];
          tx2.moveTo(P[0][0], P[0][1]);
          if (P.length === 1) tx2.lineTo(P[0][0] + 0.1, P[0][1]);
          for (let j = 1; j < P.length && left > 0; j++) {
            const dd = Math.hypot(P[j][0] - P[j - 1][0], P[j][1] - P[j - 1][1]);
            if (dd <= left) { tx2.lineTo(P[j][0], P[j][1]); left -= dd; }
            else { const u = left / (dd || 1); tx2.lineTo(lerp(P[j - 1][0], P[j][0], u), lerp(P[j - 1][1], P[j][1], u)); left = 0; }
          }
          left -= T.size * 0.11;
        }
        tx2.stroke(); tx2.globalCompositeOperation = 'source-over';
        tx.setTransform(1, 0, 0, 1, 0, 0);
        tx.drawImage(TMP2, 0, 0, w, h, 0, 0, w, h);
      }
      tx.setTransform(1, 0, 0, 1, 0, 0);
      const id = tx.getImageData(0, 0, w, h).data, buf = TG.L[lay];
      for (let yy = 0; yy < h; yy++) {
        for (let xx = 0; xx < w; xx++) {
          const a = id[(yy * w + xx) * 4 + 3];
          if (a) { const v = (a / 255) * k, q = (yy + y0) * BW + xx + x0; buf[q] = buf[q] + v - buf[q] * v; }
        }
      }
    },
  };
  addEl(e);
  return e;
}

// ---------- Compound Stroke Helpers ----------
function circleStroke(cx, cy, r, o, t0, d) {
  o = o || {};
  const a0 = o.a0 ?? rnd(0, TAU), turn = o.turn ?? 1.07, ry = o.ry ?? r;
  return PEN(ell(cx, cy, r, ry, o.rot || 0, a0, a0 + TAU * turn, Math.max(16, (r * 0.65) | 0)), {
    w: o.w ?? 2.4, layer: o.layer, ta: 0.1, tb: 0.12, wob: o.wob ?? 0.5, p: o.p, kind: o.kind, ghost: o.ghost,
  }, t0, d);
}

function rectStroke(x, y, w, h, r, o, t0, d) {
  o = o || {};
  const P = roundedRectPts(x, y, w, h, r, o.rot || 0);
  P.push(P[0]);
  return PEN(P, {
    w: o.w ?? 2.6, layer: o.layer, wob: o.wob ?? 0.65, smooth: false, ghost: o.ghost, p: o.p,
  }, t0, d);
}

function arrow(P, o, t0, d) {
  o = o || {};
  const lay = o.layer || 'coral', w = o.w ?? 4.8;
  const Sp = spline(P, 2.2);
  let t = PEN(P, { w, layer: lay, ta: 0.08, tb: 0.06, wob: 0.6, ghost: o.ghost }, t0, d * 0.78);
  const e = Sp[Sp.length - 1], f = Sp[Math.max(0, Sp.length - 9)];
  const a = Math.atan2(e[1] - f[1], e[0] - f[0]), L = o.head ?? 22;
  const sides = [1, -1].map(sg => {
    const b = a + Math.PI + sg * 0.5;
    return [
      [e[0] + Math.cos(b) * L, e[1] + Math.sin(b) * L],
      [e[0] + Math.cos(b) * L * 0.5 + rnd(-1, 1), e[1] + Math.sin(b) * L * 0.5],
      [e[0], e[1]],
    ];
  });
  t = PEN(sides[0], { w: w * 0.9, layer: lay, ta: 0.35, tb: 0.06, wob: 0.3, ghost: o.ghost }, t, d * 0.11);
  return PEN(sides[1], { w: w * 0.9, layer: lay, ta: 0.35, tb: 0.06, wob: 0.3, ghost: o.ghost }, t, d * 0.11);
}

function checkMark(cx, cy, sz, o, t0, d) {
  o = o || {};
  return PEN(
    [[cx - sz * 0.48, cy - sz * 0.05], [cx - sz * 0.12, cy + sz * 0.42], [cx + sz * 0.56, cy - sz * 0.46]],
    { w: o.w ?? 4.2, layer: o.layer || 'coral', smooth: false, wob: 0.3, ta: 0.15, tb: 0.15, ghost: o.ghost },
    t0, d
  );
}

function starStroke(cx, cy, r, ptsCount, o, t0, d) {
  o = o || {};
  const P = [];
  for (let i = 0; i <= ptsCount * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / ptsCount;
    const rr = i % 2 === 0 ? r : r * (o.inner ?? 0.38);
    P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return PEN(P, { w: o.w ?? 2.6, layer: o.layer || 'graph', smooth: false, wob: 0.35, ghost: o.ghost }, t0, d);
}

// =========================================================================
// Camera, Stylus, Composite, Cache
// =========================================================================
let CAM = [];
function cam(t) {
  let i = 0;
  while (i < CAM.length - 2 && t >= CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[i + 1];
  const span = b.t - a.t, u0 = span > 1e-6 ? clamp((t - a.t) / span) : 1;
  const u = b.k === 'g' ? gease(u0) : b.k === 'i' ? Math.pow(u0, 2.2) : b.k === 'p' ? eo(u0) : eio(u0);
  let x = lerp(a.x, b.x, u), y = lerp(a.y, b.y, u);
  if (b.k === 'f' && b.fn) {
    const p = b.fn(t), w = sstep(u0 / 0.25) * (1 - sstep((u0 - 0.8) / 0.2));
    x = lerp(x, p[0], w);
    y = lerp(y, p[1], w);
  }
  return {
    x,
    y,
    z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)),
    r: (lerp(a.r, b.r, u) * Math.PI) / 180,
  };
}

function toScreen(c, x, y) {
  const dx = (x - c.x) * c.z, dy = (y - c.y) * c.z, cs = Math.cos(c.r), sn = Math.sin(c.r);
  return [W / 2 + dx * cs - dy * sn, H / 2 + dx * sn + dy * cs];
}

function toWorld(c, X, Y) {
  const dx = X - W / 2, dy = Y - H / 2, cs = Math.cos(-c.r), sn = Math.sin(-c.r);
  return [c.x + (dx * cs - dy * sn) / c.z, c.y + (dx * sn + dy * cs) / c.z];
}

// ---------- Stylus ----------
let NIBS = [];
const OFF = [W + 170, H + 260];
function stylusAt(t) {
  const c = cam(t);
  let act = null;
  for (const e of NIBS) if (t >= e.t0 && t < e.t0 + e.d) act = e;
  if (act) {
    const p = act.nib((t - act.t0) / act.d);
    return { P: toScreen(c, p[0], p[1]), lift: 0 };
  }
  let prev = null, next = null;
  for (const e of NIBS) {
    if (e.t0 + e.d <= t && (!prev || e.t0 + e.d >= prev.t0 + prev.d)) prev = e;
    if (e.t0 > t && (!next || e.t0 < next.t0)) next = e;
  }
  const ta = prev ? prev.t0 + prev.d : -9, tb = next ? next.t0 : 1e9, gap = tb - ta;
  const pa = prev ? toScreen(c, ...prev.nib(1)) : OFF, pb = next ? toScreen(c, ...next.nib(0)) : OFF;
  if (gap > 1.05 || !prev || !next) {
    if (prev && t - ta < 0.42) {
      const u = eio((t - ta) / 0.42);
      return { P: [lerp(pa[0], OFF[0], u), lerp(pa[1], OFF[1], u)], lift: Math.min(1, u * 2) };
    }
    if (next && tb - t < 0.42) {
      const u = eio(1 - (tb - t) / 0.42);
      return { P: [lerp(OFF[0], pb[0], u), lerp(OFF[1], pb[1], u)], lift: Math.min(1, (1 - u) * 2) };
    }
    return null;
  }
  const u = (t - ta) / gap;
  return {
    P: [lerp(pa[0], pb[0], eio(u)), lerp(pa[1], pb[1], eio(u))],
    lift: Math.sin(Math.PI * u) * clamp(gap / 0.3, 0.25, 1),
  };
}

function drawStylus(t) {
  const n = stylusAt(t);
  if (!n) return;
  const [X, Y] = n.P;
  if (X < -120 || X > W + 240 || Y < -120 || Y > H + 320) return;
  const n2 = stylusAt(t + 1 / 48), lean = n2 ? clamp((n2.P[0] - X) * 0.004, -0.06, 0.06) : 0;
  const ang = 0.92 + lean, d = [Math.cos(ang), Math.sin(ang)], nn = [-d[1], d[0]], h0 = 4 + n.lift * 24;
  const P = (s, o) => [X + d[0] * s + nn[0] * o, Y + d[1] * s + nn[1] * o];
  const body = (k = 0) => {
    const L = 560, rw = 12, sh = s => [k * (h0 + s * 0.05) * 0.9, k * (h0 + s * 0.05) * 0.35];
    return [[0, 0], [12, -2.5], [44, -rw], [L, -rw], [L + 8, -rw * 0.6], [L + 8, rw * 0.6], [L, rw], [44, rw], [12, 2.5]]
      .map(([s, o]) => { const q = P(s, o), e = sh(s); return [q[0] + e[0], q[1] + e[1]]; });
  };
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(120,98,76,0.16)';
  ctx.beginPath(); polyPath(ctx, body(1)); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fbf8f2'; ctx.beginPath(); polyPath(ctx, body(0)); ctx.fill();
  ctx.fillStyle = '#ebe5da'; ctx.beginPath(); polyPath(ctx, [P(44, 4), P(560, 4), P(560, 12), P(44, 12)]); ctx.fill();
  ctx.fillStyle = '#ddd6cb'; ctx.beginPath(); polyPath(ctx, [P(12, -2.5), P(44, -12), P(44, 12), P(12, 2.5)]); ctx.fill();
  ctx.fillStyle = '#4a3f37'; ctx.beginPath(); polyPath(ctx, [P(0, 0), P(12, -2.5), P(12, 2.5)]); ctx.fill();
  ctx.strokeStyle = '#c9bdab'; ctx.lineWidth = 1.3; ctx.lineJoin = 'round';
  ctx.beginPath(); polyPath(ctx, body(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...P(44, -12)); ctx.lineTo(...P(44, 12)); ctx.stroke();
  ctx.restore();
}

// =========================================================================
// Short-Form / Viral Captions (STRICT Safe Zone: y 1184..1290 px <= 1360)
// =========================================================================
let SUB_CHUNKS = [];
const KEEP_PAIRS = new Set([
  'ai trinity', 'kali lipat', 'dua arah', 'baca pikiran', 'proyek a', 'proyek b',
  'asisten pribadi', '100 kali', '200 kali', '2.000 kali', 'sampai jumpa',
  'nggak usah', 'nggak perlu', 'nggak harus', 'nggak nyampur', 'nggak takut',
  'nggak dibilang', 'nggak bisa', 'draf email', 'pelajaran kali', 'tiga ai',
  'konteks jelas', 'dua ratus', 'dua ribu', 'empat jurus', 'copy-paste',
]);

function buildSubChunks(wordsJson, linesJson) {
  const spMap = {};
  for (const l of linesJson.lines || []) spMap[l.id] = l.speaker || 'MENTOR';
  const chunks = [];

  wordsJson.forEach((entry, eIdx) => {
    const speaker = spMap[entry.id] || 'MENTOR';
    const nextEntry = wordsJson[eIdx + 1];
    const hardCap = nextEntry ? nextEntry.t0 - 0.03 : 131.92;
    const words = entry.words || [];
    let i = 0;
    const lineChunks = [];

    while (i < words.length) {
      const grp = [words[i]];
      i++;
      while (i < words.length && grp.length < 3) {
        const last = grp[grp.length - 1];
        const prevClean = last.w.replace(/[.,!?:;"']/g, '').toLowerCase();
        if (/[.,!?:;]$/.test(last.w)) break;
        const nxt = words[i];
        const nxtClean = nxt.w.replace(/[.,!?:;"']/g, '').toLowerCase();
        const isPair = KEEP_PAIRS.has(prevClean + ' ' + nxtClean);
        const curLen = grp.reduce((s, w) => s + w.w.length + 1, 0);
        if (!isPair && grp.length >= 2 && curLen + nxt.w.length > 18) break;
        if (curLen + nxt.w.length > 23 && grp.length >= 1) break;
        grp.push(nxt);
        i++;
      }
      lineChunks.push({ speaker, words: grp, t0: grp[0].t0 - 0.03, t1: grp[grp.length - 1].t1 + 0.10 });
    }

    for (let k = 0; k < lineChunks.length; k++) {
      const c = lineChunks[k];
      if (k === 0) c.t0 = Math.max(0, entry.t0);
      if (k < lineChunks.length - 1) c.t1 = lineChunks[k + 1].t0;
      else c.t1 = Math.min(hardCap, Math.max(c.t1, entry.t1));
      if (c.t1 > c.t0 + 0.05) chunks.push(c);
    }
  });
  return chunks;
}

function drawSubs(t) {
  if (!SUB_CHUNKS.length || t >= 131.92) return;
  const q = SUB_CHUNKS.find(c => t >= c.t0 && t < c.t1);
  if (!q) return;

  const fin = clamp((t - q.t0) / 0.14), fout = clamp((q.t1 - t) / 0.12);
  ctx.save();
  ctx.font = '800 44px PJEB, sans-serif';
  const spaceW = ctx.measureText(' ').width;
  const wordWidths = q.words.map(w => ctx.measureText(w.w).width);
  const textW = wordWidths.reduce((a, b) => a + b, 0) + spaceW * (q.words.length - 1);
  const chipW = Math.min(960, Math.max(240, textW + 64));
  const chipH = 74;
  const chipX = (W - chipW) / 2;
  const chipY = 1212;  // pill sits at 1184..1214, chip sits 1212..1286 -> strictly within 1184..1290 px

  const slideY = (1 - eo(fin)) * 10;
  ctx.globalAlpha = fout * eo(fin);
  ctx.translate(0, slideY);

  // Offset tactile shadow
  ctx.fillStyle = 'rgba(67,54,46,0.22)';
  ctx.beginPath();
  ctx.roundRect(chipX + 7, chipY + 7, chipW, chipH, 16);
  ctx.fill();

  // Cream paper chip + graphite border
  ctx.fillStyle = '#fbf7ee';
  ctx.beginPath();
  ctx.roundRect(chipX, chipY, chipW, chipH, 16);
  ctx.fill();
  ctx.strokeStyle = C.graphite;
  ctx.lineWidth = 3.2;
  ctx.stroke();

  // Speaker badge (MURID coral / MENTOR teal) sitting cleanly at y=1184..1214
  const isMurid = q.speaker === 'MURID';
  const pillW = isMurid ? 114 : 132;
  const pillH = 30;
  const pillX = chipX + 20;
  const pillY = 1184;
  ctx.fillStyle = isMurid ? C.coral : C.mentorTeal;
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 9);
  ctx.fill();
  ctx.strokeStyle = C.graphite;
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.fillStyle = '#fbf7ee';
  ctx.font = '800 18px PJEB, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(q.speaker, pillX + pillW / 2, pillY + pillH / 2 + 1);

  // Active word highlight + clean ink words inside chip
  ctx.font = '800 44px PJEB, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  let wxPos = W / 2 - textW / 2;
  const wyPos = chipY + chipH / 2 + 2;

  q.words.forEach((w, idx) => {
    const ww = wordWidths[idx];
    const active = t >= w.t0 - 0.03 && t <= w.t1 + 0.04;
    if (active) {
      ctx.fillStyle = 'rgba(241,192,79,0.58)';
      ctx.beginPath();
      ctx.roundRect(wxPos - 6, chipY + 12, ww + 12, chipH - 24, 8);
      ctx.fill();
      ctx.fillStyle = '#b93b1f';
    } else {
      ctx.fillStyle = '#382c25';
    }
    ctx.fillText(w.w, wxPos, wyPos);
    wxPos += ww + spaceW;
  });

  ctx.restore();
}

// =========================================================================
// Compositor (Paper grain x Colour x Pencil layers) with capped ImageData
// =========================================================================
const IMGS = {};
const IMG_KEYS = [];

function viewBox(c) {
  const cs = [[0, 0], [W, 0], [0, H], [W, H]].map(([X, Y]) => toWorld(c, X, Y));
  const [a, b, cc, d] = bbox(cs);
  const x0 = Math.max(0, Math.floor(PX(a)) - 2);
  const y0 = Math.max(0, Math.floor(PY(b)) - 2);
  const x1 = Math.min(BW, Math.ceil(PX(cc)) + 2);
  const y1 = Math.min(BH, Math.ceil(PY(d)) + 2);
  return [x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0)];
}

function composite(c, vb) {
  const [x0, y0, w, h] = vb || viewBox(c);
  if (w <= 0 || h <= 0) return [0, 0, 0, 0];

  const key = w + 'x' + h;
  let img = IMGS[key];
  if (!img) {
    if (IMG_KEYS.length >= 32) {
      const old = IMG_KEYS.shift();
      delete IMGS[old];
    }
    img = new ImageData(w, h);
    IMGS[key] = img;
    IMG_KEYS.push(key);
  }

  const o = img.data;
  const fd = TG.fx.getImageData(x0, y0, w, h).data;
  const L0 = TG.L.light, A0 = LAYERS.light.alpha, C0 = LAYERS.light.col;
  const L1 = TG.L.graph, A1 = LAYERS.graph.alpha, C1 = LAYERS.graph.col;
  const L2 = TG.L.coral, A2 = LAYERS.coral.alpha, C2 = LAYERS.coral.col;

  for (let y = 0; y < h; y++) {
    const row = (y + y0) * BW + x0;
    const jRow = y * w * 4;
    for (let x = 0; x < w; x++) {
      const i = row + x, j = jRow + x * 4, g = GRAIN[i];
      let r = PP_R[i], gg = PP_G[i], bb = PP_B[i];
      const fa = fd[j + 3] / 255;
      if (fa) {
        const al = fa * (0.86 + 0.14 * (1 - g * 0.8));
        const ial = 1 - al;
        r *= ial + (al * fd[j]) / 255;
        gg *= ial + (al * fd[j + 1]) / 255;
        bb *= ial + (al * fd[j + 2]) / 255;
      }
      const v0 = L0[i];
      if (v0) {
        const al = clamp((v0 * 0.9 - g * 0.85 + 0.32) * 2.1) * A0;
        if (al > 0) { const ial = 1 - al; r *= ial + al * C0[0]; gg *= ial + al * C0[1]; bb *= ial + al * C0[2]; }
      }
      const v1 = L1[i];
      if (v1) {
        const al = clamp((v1 * 0.9 - g * 0.85 + 0.32) * 2.1) * A1;
        if (al > 0) { const ial = 1 - al; r *= ial + al * C1[0]; gg *= ial + al * C1[1]; bb *= ial + al * C1[2]; }
      }
      const v2 = L2[i];
      if (v2) {
        const al = clamp((v2 * 0.9 - g * 0.85 + 0.32) * 2.1) * A2;
        if (al > 0) { const ial = 1 - al; r *= ial + al * C2[0]; gg *= ial + al * C2[1]; bb *= ial + al * C2[2]; }
      }
      o[j] = r * 255;
      o[j + 1] = gg * 255;
      o[j + 2] = bb * 255;
      o[j + 3] = 255;
    }
  }
  wx.putImageData(img, x0, y0);
  return [x0, y0, w, h];
}

function clearTarget(T) {
  for (const n of ORDER) T.L[n].fill(0);
  T.fx.clearRect(0, 0, BW, BH);
}

function renderMarks(t, vb) {
  let k = 0;
  while (k < EL.length && t >= EL[k].t0 + EL[k].d) k++;
  if (cacheK > k) {
    clearTarget(CACHE);
    cacheK = 0;
  }
  if (cacheK < k) {
    TG = CACHE;
    for (let i = cacheK; i < k; i++) EL[i].apply(1);
    cacheK = k;
  }
  let partial = false;
  for (let i = k; i < EL.length; i++) {
    if (t >= EL[i].t0) { partial = true; break; }
  }
  if (!partial) {
    TG = CACHE;
    return;
  }
  const [vx0, vy0, vw, vh] = vb || [0, 0, BW, BH];
  if (vw > 0 && vh > 0) {
    const s0 = vy0 * BW, s1 = (vy0 + vh) * BW;
    for (const n of ORDER) WORK.L[n].subarray(s0, s1).set(CACHE.L[n].subarray(s0, s1));
    WORK.fx.clearRect(vx0, vy0, vw, vh);
    WORK.fx.drawImage(CACHE.fc, vx0, vy0, vw, vh, vx0, vy0, vw, vh);
  }
  TG = WORK;
  for (let i = k; i < EL.length; i++) {
    const e = EL[i];
    if (t >= e.t0 && t < e.t0 + e.d) e.apply(clamp((t - e.t0) / e.d));
    else if (t >= e.t0 + e.d) e.apply(1);
  }
}

function renderFull(t) {
  if (THUMB) {
    drawCoverFrame();
    return;
  }
  const c = cam(t);
  const vb = viewBox(c);
  renderMarks(t, vb);
  const [x0, y0, w, h] = composite(c, vb);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);

  if (w > 0 && h > 0) {
    ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
    ctx.rotate(c.r);
    ctx.scale(c.z / S, c.z / S);
    ctx.translate(-(c.x - X0) * S, -(c.y - Y0) * S);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(WC, x0, y0, w, h, x0, y0, w, h);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const d of DYN) {
    if (t >= d.t0 && t < d.t1) d.draw(t, c);
  }

  // Soft warm paper vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.44, W / 2, H / 2, H * 1.15);
  g.addColorStop(0, 'rgba(120,100,80,0)');
  g.addColorStop(1, 'rgba(120,100,80,0.09)');
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  if (CLEAN) return;
  drawStylus(t);
  drawSubs(t);
}

window.render = t => renderFull(THUMB ? 0 : (FROM + t));
window.CAMAT = cam;

window.TEXTS = t => {
  if (THUMB) return [];
  t += FROM;
  const c = cam(t), out = [];
  EL.forEach((e, i) => {
    if (e.kind !== 'write' || e.pass || t < e.t0) return;
    const [a, b, cc, d] = e.T.box;
    const cs = [[a, b], [cc, b], [a, d], [cc, d]].map(([x, y]) => toScreen(c, x, y));
    const bb = bbox(cs);
    out.push({ id: 'txt' + i, text: e.T.s, x0: bb[0], y0: bb[1], x1: bb[2], y1: bb[3] });
  });
  return out;
};
</script>
<script src="art.js"></script>
<script src="scenes.js"></script>
<script>
async function boot() {
  if (THUMB) {
    drawCoverFrame();
    await Promise.all([
      document.fonts.load('800 44px PJEB', 'AI TOOLS'),
      document.fonts.load('700 48px CB', 'MASTERY'),
    ]).catch(() => {});
    drawCoverFrame();
    window.EV = [];
    window.READY = true;
    return;
  }

  const [gly, wordsJson, linesJson] = await Promise.all([
    fetch('glyphs.json').then(r => r.json()),
    fetch('voice/words.json').then(r => r.json()),
    fetch('voice/lines.json').then(r => r.json()),
  ]);
  GLY = gly;
  SUB_CHUNKS = buildSubChunks(wordsJson, linesJson);

  await Promise.all([
    document.fonts.load('700 44px CB', 'AI'),
    document.fonts.load('500 44px CM', 'AI'),
    document.fonts.load('800 44px PJEB', 'AI'),
    document.fonts.load('600 44px PJSB', 'AI'),
  ]);

  buildGrain();
  CACHE = mkTarget();
  WORK = mkTarget();
  TG = CACHE;

  window.buildPage();

  // Sort chronologically so linear cache advancement never skips marks
  EL.sort((a, b) => a.t0 - b.t0);
  NIBS = EL.filter(e => e.nib);

  const ev = [];
  for (const e of EL) {
    if (e.kind === 'occ' || e.kind === 'none') continue;
    const tm = e.t0 + e.d / 2, c = cam(tm), p = e.nib ? e.nib(0.5) : e.wx;
    ev.push({ t: e.t0, type: e.kind, d: e.d, pan: clamp((toScreen(c, p[0], p[1])[0] / W) * 2 - 1, -1, 1) });
  }
  NIBS.forEach((e, i) => {
    const prev = i > 0 ? NIBS[i - 1].t0 + NIBS[i - 1].d : -1;
    if (e.t0 - prev > 0.11 && e.t0 >= 0) {
      const c = cam(e.t0), p = e.nib(0);
      ev.push({ t: e.t0, type: 'tap', d: 0.05, pan: clamp((toScreen(c, p[0], p[1])[0] / W) * 2 - 1, -1, 1) });
    }
  });
  ev.push(...SFX);
  window.EV = ev
    .filter(e => e.t >= FROM && e.t < TO)
    .map(e => ({ ...e, t: +(e.t - FROM).toFixed(4), d: +(e.d || 0).toFixed(4), pan: +clamp(e.pan || 0, -1, 1).toFixed(3) }));

  renderFull(FROM);
  window.READY = true;
}
boot();
</script>
