<script>
const W = 1080, H = 1920, FPS = 30;
window.WIDTH = W;
window.HEIGHT = H;

const QS = new URLSearchParams(location.search);
const FROM = +(QS.get('from') ?? 0);
const CLEAN = QS.get('clean') === '1';
const THUMB = QS.get('thumb') === '1';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// World canvas domain: portrait 1-page master sheet buffered at S = 1.75x
const X0 = -90, Y0 = -120, DW = 1260, DH = 2160, S = 1.75;
const BW = Math.round(DW * S), BH = Math.round(DH * S);
const PX = x => (x - X0) * S;
const PY = y => (y - Y0) * S;

// Curated palette for Tablet Sketch Explainer (Part 1: Fundamental AI)
const C = {
  paper: '#f3eadb',
  graphite: '#43362e',
  light: '#a8998a',
  coral: '#dc6a4c',
  mustard: '#f1c04f',
  sage: '#8fb58d',
  sageDk: '#5f8a5e',
  slate: '#7ca0b8',
  slateDk: '#50728a',
  terra: '#d88a6b',
  terraDk: '#ab5e42',
  lav: '#a895be',
  lavDk: '#786691',
  ochre: '#dda952',
  grey: '#b8afa4',
  greyDk: '#8e8478'
};

const hex = c => [
  parseInt(c.slice(1, 3), 16) / 255,
  parseInt(c.slice(3, 5), 16) / 255,
  parseInt(c.slice(5, 7), 16) / 255
];

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = mulberry(20261122);
const rnd = (a = 0, b = 1) => a + (b - a) * R();

function h2(x, y) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const n1 = (s, seed) => vn(s, seed * 13.7);
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const sstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const gease = u => 0.45 * eio(u) + 0.55 * eo(u);
const TAU = Math.PI * 2;

// ---------- Canvas-space paper grain (fixed to paper buffer) ----------
let GRAIN, GRAIN2, PAPER_RGB;
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}
const PAPER_WC = mkCanvas(BW, BH);
const CACHE_WC = mkCanvas(BW, BH);
const WC = mkCanvas(BW, BH);
const paperWx = PAPER_WC.getContext('2d');
const cacheWx = CACHE_WC.getContext('2d');
const wx = WC.getContext('2d');

function buildGrain() {
  const N = BW * BH;
  const wn = new Float32Array(N);
  const tmp = new Float32Array(N);
  GRAIN = new Float32Array(N);
  GRAIN2 = new Float32Array(N);
  const GK = 1.5 / S;
  for (let i = 0; i < N; i++) {
    wn[i] = h2(Math.floor((i % BW) * GK) * 3 + 11, Math.floor(((i / BW) | 0) * GK) * 7 + 5);
  }
  for (let y = 0; y < BH; y++) {
    const o = y * BW;
    for (let x = 0; x < BW; x++) {
      tmp[o + x] = (wn[o + Math.max(0, x - 1)] + wn[o + x] + wn[o + Math.min(BW - 1, x + 1)]) / 3;
    }
  }
  for (let y = 0; y < BH; y++) {
    const a = Math.max(0, y - 1) * BW, b = y * BW, c = Math.min(BH - 1, y + 1) * BW;
    for (let x = 0; x < BW; x++) {
      const fine = (tmp[a + x] + tmp[b + x] + tmp[c + x]) / 3;
      const gx = x * GK, gy = y * GK;
      const g = 0.45 * fine * 1.6 - 0.22 + 0.35 * vn(gx / 2.3 + (gy * 0.35) / 2.3, gy / 1.6) + 0.2 * vn(gx / 7, gy / 7);
      GRAIN[b + x] = g;
      GRAIN2[b + x] = vn(gx / 90, gy / 90) * 0.6 + vn(gx / 23, gy / 23) * 0.4;
    }
  }
  let m = 0, v = 0, n = 0;
  for (let i = 0; i < N; i += 7) { m += GRAIN[i]; n++; }
  m /= n;
  for (let i = 0; i < N; i += 7) v += (GRAIN[i] - m) ** 2;
  v = Math.sqrt(v / n);
  for (let i = 0; i < N; i++) GRAIN[i] = clamp(0.5 + ((GRAIN[i] - m) / v) * 0.2);

  // Precompute base paper image once
  const img = paperWx.createImageData(BW, BH);
  const d = img.data;
  const pp = hex(C.paper);
  for (let i = 0; i < N; i++) {
    const g = GRAIN[i], g2 = GRAIN2[i];
    const pk = (0.985 + 0.03 * g2) * (0.99 + 0.02 * g);
    const j = i * 4;
    d[j] = pp[0] * pk * 255;
    d[j + 1] = pp[1] * pk * 255;
    d[j + 2] = pp[2] * (0.985 + 0.03 * g2) * (0.985 + 0.025 * g) * 255;
    d[j + 3] = 255;
  }
  paperWx.putImageData(img, 0, 0);
  cacheWx.drawImage(PAPER_WC, 0, 0);
  wx.drawImage(PAPER_WC, 0, 0);
}

// ---------- Layers & Targets ----------
const LAYERS = {
  light: { col: hex(C.light), alpha: 0.55 },
  graph: { col: hex(C.graphite), alpha: 0.95 },
  coral: { col: hex(C.coral), alpha: 0.95 }
};
const ORDER = ['light', 'graph', 'coral'];

function mkTarget() {
  const fc = mkCanvas(BW, BH);
  return {
    L: { light: new Float32Array(BW * BH), graph: new Float32Array(BW * BH), coral: new Float32Array(BW * BH) },
    fc,
    fx: fc.getContext('2d', { willReadFrequently: true })
  };
}
let CACHE, WORK, TG, cacheK = 0, lastActiveBoxes = [];
const TMP = mkCanvas(1200, 1200), tx = TMP.getContext('2d', { willReadFrequently: true });
const TMP2 = mkCanvas(1200, 1200), tx2 = TMP2.getContext('2d');
function tmpSize(c, w, h) {
  if (c.width < w || c.height < h) {
    c.width = Math.max(c.width, w);
    c.height = Math.max(c.height, h);
  }
}

// ---------- Geometry ----------
function spline(P, step = 2) {
  if (P.length < 2) return P.slice();
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const n = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}

function resample(P, step) {
  const out = [P[0].slice()];
  let acc = 0;
  for (let i = 1; i < P.length; i++) {
    let [x0, y0] = P[i - 1];
    const [x1, y1] = P[i];
    let d = Math.hypot(x1 - x0, y1 - y0);
    while (acc + d >= step) {
      const t = (step - acc) / d;
      x0 += (x1 - x0) * t;
      y0 += (y1 - y0) * t;
      out.push([x0, y0]);
      d = Math.hypot(x1 - x0, y1 - y0);
      acc = 0;
    }
    acc += d;
  }
  return out;
}

function ell(cx, cy, rx, ry, rot = 0, a0 = 0, a1 = TAU, n = 48, wob = 0) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = a0 + ((a1 - a0) * i) / n;
    const k = 1 + wob * Math.sin(2 * a);
    const x = rx * Math.cos(a) * k, y = ry * Math.sin(a) * k;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}

function bez(p0, p1, p2, p3, n = 22) {
  const P = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    P.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
    ]);
  }
  return P;
}

function rectPoly(x, y, w, h) {
  return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
}

function roundRectPoly(x, y, w, h, r = 10) {
  r = Math.min(r, w / 2, h / 2);
  const P = [];
  const corners = [
    [x + w - r, y + r, -Math.PI / 2, 0],
    [x + w - r, y + h - r, 0, Math.PI / 2],
    [x + r, y + h - r, Math.PI / 2, Math.PI],
    [x + r, y + r, Math.PI, Math.PI * 1.5]
  ];
  for (const [cx, cy, a0, a1] of corners) {
    for (let i = 0; i <= 5; i++) {
      const a = a0 + ((a1 - a0) * i) / 5;
      P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  }
  return P;
}

function bbox(P) {
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (const [x, y] of P) {
    if (x < a) a = x;
    if (y < b) b = y;
    if (x > c) c = x;
    if (y > d) d = y;
  }
  return [a, b, c, d];
}

function centroid(P) {
  let x = 0, y = 0;
  for (const p of P) { x += p[0]; y += p[1]; }
  return [x / P.length, y / P.length];
}

function roughen(P, amp = 1.5) {
  const seed = rnd(0, 999);
  const D = resample(P.concat([P[0]]), 3);
  const N = D.length, out = [];
  for (let i = 0; i < N; i++) {
    const a = D[(i - 1 + N) % N], b = D[(i + 1) % N];
    let tx_ = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx_, ty) || 1;
    tx_ /= l;
    ty /= l;
    const s = i * 3;
    const off = amp * ((n1(s / 30, seed) - 0.5) * 1.6 + (n1(s / 4, seed + 5) - 0.5) * 0.9 + (h2(i, seed | 0) - 0.5) * 0.5);
    out.push([D[i][0] - ty * off, D[i][1] + tx_ * off]);
  }
  return out;
}

function plen(P) {
  let s = 0;
  for (let i = 1; i < P.length; i++) s += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  return s;
}

function along(P, d) {
  for (let i = 1; i < P.length; i++) {
    const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    if (d <= l) {
      const u = l ? d / l : 0;
      return [lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u)];
    }
    d -= l;
  }
  return P[P.length - 1].slice();
}

function polyPath(c, P, k = 1, ox = 0, oy = 0) {
  c.moveTo(P[0][0] * k + ox, P[0][1] * k + oy);
  for (let i = 1; i < P.length; i++) c.lineTo(P[i][0] * k + ox, P[i][1] * k + oy);
  c.closePath();
}

// ---------- Timeline Marks ----------
const EL = [];
function clampBoxPx(x0, y0, x1, y1) {
  const cx0 = Math.max(0, Math.min(BW, Math.floor(x0)));
  const cy0 = Math.max(0, Math.min(BH, Math.floor(y0)));
  const cx1 = Math.max(cx0, Math.min(BW, Math.ceil(x1)));
  const cy1 = Math.max(cy0, Math.min(BH, Math.ceil(y1)));
  return [cx0, cy0, cx1, cy1];
}

function unionBoxPx(a, b) {
  if (!a) return b;
  if (!b) return a;
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
}

function boxesOverlap(a, b, pad = 28) {
  return !(a[2] + pad < b[0] || b[2] + pad < a[0] || a[3] + pad < b[1] || b[3] + pad < a[1]);
}

function clusterBoxes(boxes, pad = 28) {
  const clusters = [];
  for (const box of boxes) {
    if (!box || box[2] <= box[0] || box[3] <= box[1]) continue;
    let cur = box.slice();
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = clusters.length - 1; i >= 0; i--) {
        if (boxesOverlap(cur, clusters[i], pad)) {
          cur = unionBoxPx(cur, clusters[i]);
          clusters.splice(i, 1);
          merged = true;
        }
      }
    }
    clusters.push(cur);
  }
  return clusters;
}

function addEl(e) {
  e.d = Math.max(e.d, 1 / FPS);
  if (e.ghost) {
    e.kind = 'none';
    delete e.nib;
  }
  EL.push(e);
  return e.t0 + e.d;
}

function PEN(pts, o = {}, t0 = 0, d = 0.4) {
  const lay = o.layer || 'graph';
  const w = (o.w ?? 2.4) * 1.15;
  const wob = o.wob ?? 0.7;
  const press = o.p ?? 1;
  const ta = o.ta ?? 0.16;
  const tb = o.tb ?? 0.2;
  const seed = rnd(0, 999);
  let P = o.smooth === false ? pts : spline(pts, 2);
  P = resample(P, 0.55);
  if (P.length < 2) return t0;
  const N = P.length, tot = (N - 1) * 0.55, st = new Float32Array(N * 4), nib = [];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < N; i++) {
    const a = P[Math.max(0, i - 2)], b = P[Math.min(N - 1, i + 2)];
    let tx_ = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx_, ty) || 1;
    tx_ /= l;
    ty /= l;
    const s = i * 0.55;
    const off = wob * ((n1(s / 38, seed) - 0.5) * 2 + (n1(s / 9, seed + 3) - 0.5) * 0.5);
    const qx = P[i][0] - ty * off, qy = P[i][1] + tx_ * off;
    let p = Math.pow(clamp(s / (tot * ta + 1e-3)), 0.55) * Math.pow(clamp((tot - s) / (tot * tb + 1e-3)), 0.55);
    p = press * (0.14 + 0.86 * p) * (0.84 + 0.16 * n1(s / 22, seed + 7));
    const r = w * 0.5 * (0.5 + 0.5 * p) * S, cx = PX(qx), cy = PY(qy);
    st[i * 4] = cx;
    st[i * 4 + 1] = cy;
    st[i * 4 + 2] = r;
    st[i * 4 + 3] = 0.32 + 0.68 * p;
    x0 = Math.min(x0, cx - r);
    y0 = Math.min(y0, cy - r);
    x1 = Math.max(x1, cx + r);
    y1 = Math.max(y1, cy + r);
    if (i % 8 === 0 || i === N - 1) nib.push([qx, qy]);
  }
  const bx0 = Math.max(0, Math.floor(x0 - 2)), by0 = Math.max(0, Math.floor(y0 - 2));
  const bx1 = Math.min(BW, Math.ceil(x1 + 2)), by1 = Math.min(BH, Math.ceil(y1 + 2));
  const bw = bx1 - bx0, bh = by1 - by0;
  if (bw <= 0 || bh <= 0) return t0 + d;
  return addEl({
    t0, d, ghost: o.ghost, kind: lay === 'light' ? 'light' : (o.kind || 'pencil'),
    wx: centroid(nib), boxPx: [bx0, by0, bx1, by1],
    nib: p => nib[Math.min(nib.length - 1, Math.floor(clamp(p) * (nib.length - 1)))],
    apply(prog) {
      const n = prog >= 1 ? N : Math.floor(prog * N);
      if (n < 2) return;
      const B = new Float32Array(bw * bh);
      for (let i = 0; i < n; i++) {
        const cx = st[i * 4] - bx0, cy = st[i * 4 + 1] - by0, r = st[i * 4 + 2], val = st[i * 4 + 3];
        const ix0 = Math.max(0, Math.floor(cx - r - 1)), ix1 = Math.min(bw - 1, Math.ceil(cx + r + 1));
        const iy0 = Math.max(0, Math.floor(cy - r - 1)), iy1 = Math.min(bh - 1, Math.ceil(cy + r + 1));
        for (let y = iy0; y <= iy1; y++) {
          const dy = y + 0.5 - cy, row = y * bw;
          for (let x = ix0; x <= ix1; x++) {
            const dx = x + 0.5 - cx;
            const cov = r - Math.sqrt(dx * dx + dy * dy) + 0.5;
            if (cov <= 0) continue;
            const v = (cov > 1 ? 1 : cov) * val;
            if (v > B[row + x]) B[row + x] = v;
          }
        }
      }
      const buf = TG.L[lay];
      for (let y = 0; y < bh; y++) {
        const row = y * bw, o = (y + by0) * BW + bx0;
        for (let x = 0; x < bw; x++) {
          const v = B[row + x];
          if (v) {
            const k = o + x;
            buf[k] = buf[k] + v - buf[k] * v;
          }
        }
      }
    }
  });
}

function OCC(poly, t0, names = ['light', 'graph', 'coral'], fills = true) {
  const P = poly.map(([x, y]) => [PX(x), PY(y)]), [a, b, c, d] = bbox(P);
  const [x0, y0, x1, y1] = clampBoxPx(a - 1, b - 1, c + 1, d + 1);
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return t0;
  tmpSize(TMP, w, h);
  tx.clearRect(0, 0, w, h);
  tx.fillStyle = '#fff';
  tx.beginPath();
  polyPath(tx, P, 1, -x0, -y0);
  tx.fill();
  const id = tx.getImageData(0, 0, w, h).data;
  const M = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) M[i] = id[i * 4 + 3] / 255;
  return addEl({
    t0, d: 0, kind: 'occ', boxPx: [x0, y0, x1, y1],
    apply() {
      for (const nm of names) {
        const buf = TG.L[nm];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const m = M[y * w + x];
            if (m) buf[(y + y0) * BW + x + x0] *= 1 - m;
          }
        }
      }
      if (fills) {
        TG.fx.save();
        TG.fx.globalCompositeOperation = 'destination-out';
        TG.fx.beginPath();
        polyPath(TG.fx, P);
        TG.fx.fill();
        TG.fx.restore();
      }
    }
  });
}

function BLOB(poly, col, o = {}, t0 = 0, d = 0.35) {
  const dx = o.dx ?? 7, dy = o.dy ?? 5;
  const Q = roughen(poly.map(([x, y]) => [x + dx, y + dy]), o.amp ?? 1.4);
  const holes = (o.holes || []).map(h => h.map(([x, y]) => [x + dx, y + dy]));
  const cuts = o.cuts || [];
  const [a, b, c, e] = bbox(Q);
  const ang = o.ang ?? -0.5, sp = o.sp ?? 9, ca = Math.cos(ang), sa = Math.sin(ang);
  const RQ = Q.map(([x, y]) => [x * ca + y * sa, -x * sa + y * ca]);
  const [, rb, , re] = bbox(RQ);
  const path = [];
  let dir = 1, rows = 0;

// ---------- Camera & Screen Mapping ----------
let CAM = [], DYN = [], NIBS = [], SFX = [];
function cam(t) {
  if (!CAM.length) return { x: W / 2, y: H / 2, z: 1, r: 0 };
  let i = 0;
  while (i < CAM.length - 2 && t >= CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[i + 1];
  if (b.k === 'cut') {
    const seg = t < b.t ? a : b;
    return { x: seg.x, y: seg.y, z: seg.z, r: (seg.r * Math.PI) / 180 };
  }
  const span = b.t - a.t;
  const u0 = span > 1e-6 ? clamp((t - a.t) / span) : 1;
  const u = b.k === 'g' ? gease(u0) : b.k === 'i' ? Math.pow(u0, 2.3) : b.k === 'p' ? eo(u0) : eio(u0);

    x: lerp(a.x, b.x, u),
    y: lerp(a.y, b.y, u),
    z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)),
    r: (lerp(a.r, b.r, u) * Math.PI) / 180

}

  for (const e of NIBS) if (t >= e.t0 && t < e.t0 + e.d) act = e;
  if (act) {
    const p = act.nib((t - act.t0) / act.d);
    return { P: toScreen(c, p[0], p[1]), lift: 0 };
  }
  let prev = null, next = null;
  for (const e of NIBS) {
    if (e.t0 + e.d <= t && (!prev || e.t0 + e.d >= prev.t0 + prev.d)) prev = e;
    if (e.t0 > t && (!next || e.t0 < next.t0)) next = e;
  }
  const ta = prev ? prev.t0 + prev.d : -9, tb = next ? next.t0 : 1e9, gap = tb - ta;
  const pa = prev ? toScreen(c, ...prev.nib(1)) : OFF_STYLUS;
  const pb = next ? toScreen(c, ...next.nib(0)) : OFF_STYLUS;
  if (gap > 1.05 || !prev || !next) {
    if (prev && t - ta < 0.42) {
      const u = eio((t - ta) / 0.42);
      return { P: [lerp(pa[0], OFF_STYLUS[0], u), lerp(pa[1], OFF_STYLUS[1], u)], lift: Math.min(1, u * 2) };
    }

  }
  for (let i = 0; i < groups.length - 1; i++) {
    const gap = groups[i + 1].t0 - groups[i].t1;
    if (gap > 0 && gap < 0.18 && groups[i].speaker === groups[i + 1].speaker) {
      groups[i].t1 = groups[i + 1].t0;
    } else if (groups[i].t1 > groups[i + 1].t0 - 0.02) {
      groups[i].t1 = Math.max(groups[i].t0 + 0.12, groups[i + 1].t0 - 0.02);
    }
  }
  return groups;
}

function drawSubs(t) {
  if (CLEAN || THUMB || !SUB_GROUPS.length || t >= (window.DUR - 1.05)) return;
  const g = SUB_GROUPS.find(q => t >= q.t0 && t < q.t1);
  if (!g) return;

  const fin = clamp((t - g.t0) / 0.06);
  const fout = clamp((g.t1 - t) / 0.06);
  const alpha = Math.min(fin, fout);

  ctx.save();
  ctx.font = '800 40px PJSB';
  const spaceW = 14;
  const widths = g.words.map(w => ctx.measureText(w.w).width);
  const totalTxtW = widths.reduce((a, b) => a + b, 0) + spaceW * Math.max(0, g.words.length - 1);
  const padX = 36;
  const chipW = Math.min(920, Math.max(210, totalTxtW + padX * 2));
  const chipH = 78;
  const chipX = (W - chipW) / 2;
  const chipY = 1212; // Strict safe-zone: badge top 1184px, chip bottom 1290px (<= 1360px!)

  // Speaker badge overlapping top-left of paper chip
  const isMurid = g.speaker === 'murid';
  const badgeLabel = isMurid ? 'MURID' : 'MENTOR';
  const badgeCol = isMurid ? C.terra : C.slateDk;
  const hiCol = isMurid ? C.mustard : '#f4b59f';

  ctx.globalAlpha = alpha;
  // Offset shadow block (Tablet Sketch grammar)
  ctx.fillStyle = '#ddd0b8';
  ctx.beginPath();
  ctx.roundRect(chipX + 8, chipY + 7, chipW, chipH, 14);
  ctx.fill();

  // Cream paper chip
  ctx.fillStyle = '#fbf7ee';
  ctx.strokeStyle = C.graphite;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(chipX, chipY, chipW, chipH, 14);
  ctx.fill();
  ctx.stroke();

  // Speaker pill
  ctx.font = '600 18px PJSS';
  const bW = ctx.measureText(badgeLabel).width + 24;
  const bH = 28;
  const bX = chipX + 20;
  const bY = chipY - 16;
  ctx.fillStyle = badgeCol;
  ctx.beginPath();
  ctx.roundRect(bX, bY, bW, bH, 8);
  ctx.fill();
  ctx.strokeStyle = C.graphite;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fbf7ee';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillText(badgeLabel, bX + bW / 2, bY + bH / 2 + 1);

  // Words + active word pill highlight
  ctx.font = '800 40px PJSB';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  let wxCursor = chipX + (chipW - totalTxtW) / 2;
  const ty = chipY + chipH / 2 + 3;

  g.words.forEach((w, idx) => {
    const ww = widths[idx];
    const isActive = t >= w.t0 - 0.03 && t <= w.t1 + 0.04;
    if (isActive || w.kw) {
      ctx.fillStyle = isActive ? hiCol : 'rgba(241, 192, 79, 0.34)';
      ctx.beginPath();
      ctx.roundRect(wxCursor - 7, ty - 25, ww + 14, 48, 9);
      ctx.fill();
    }
    ctx.fillStyle = '#2d231d';
    ctx.fillText(w.w, wxCursor, ty);
    wxCursor += ww + spaceW;
  });

  ctx.restore();
}

// ---------- Fast Incremental Composite (Bit-identical, ~1-3ms/frame) ----------
let IMGS = {};
let IMG_KEYS = 0;
function compositeRect(srcTarget, dstCtx, x0, y0, x1, y1) {
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return;
  const key = w + 'x' + h;
  let img = IMGS[key];
  if (!img) {
    if (IMG_KEYS > 32) { IMGS = {}; IMG_KEYS = 0; }
    img = IMGS[key] = dstCtx.createImageData(w, h);
    IMG_KEYS++;
  }
  const o = img.data;
  const fd = srcTarget.fx.getImageData(x0, y0, w, h).data;
  const pp = hex(C.paper);
  const L0 = srcTarget.L.light, L1 = srcTarget.L.graph, L2 = srcTarget.L.coral;
  const C0 = LAYERS.light.col, A0 = LAYERS.light.alpha;
  const C1 = LAYERS.graph.col, A1 = LAYERS.graph.alpha;
  const C2 = LAYERS.coral.col, A2 = LAYERS.coral.alpha;

  for (let y = 0; y < h; y++) {
    const row = (y + y0) * BW + x0;
    for (let x = 0; x < w; x++) {
      const i = row + x, j = (y * w + x) * 4;
      const g = GRAIN[i], g2 = GRAIN2[i];
      const pk = (0.985 + 0.03 * g2) * (0.99 + 0.02 * g);
      let r = pp[0] * pk;
      let gg = pp[1] * pk;
      let bb = pp[2] * (0.985 + 0.03 * g2) * (0.985 + 0.025 * g);
      const fa = fd[j + 3] / 255;
      if (fa) {
        const al = fa * (0.87 + 0.13 * (1 - g * 0.78));
        r *= 1 - al + (al * fd[j]) / 255;
        gg *= 1 - al + (al * fd[j + 1]) / 255;
        bb *= 1 - al + (al * fd[j + 2]) / 255;
      }
      const v0 = L0[i];
      if (v0) {
        const al = clamp((v0 * 0.9 - g * 0.85 + 0.32) * 2.1) * A0;
        if (al > 0) { r *= 1 - al + al * C0[0]; gg *= 1 - al + al * C0[1]; bb *= 1 - al + al * C0[2]; }
      }
      const v1 = L1[i];
      if (v1) {
        const al = clamp((v1 * 0.9 - g * 0.85 + 0.32) * 2.1) * A1;
        if (al > 0) { r *= 1 - al + al * C1[0]; gg *= 1 - al + al * C1[1]; bb *= 1 - al + al * C1[2]; }
      }
      const v2 = L2[i];
      if (v2) {
        const al = clamp((v2 * 0.9 - g * 0.85 + 0.32) * 2.1) * A2;
        if (al > 0) { r *= 1 - al + al * C2[0]; gg *= 1 - al + al * C2[1]; bb *= 1 - al + al * C2[2]; }
      }
      o[j] = r * 255;
      o[j + 1] = gg * 255;
      o[j + 2] = bb * 255;
      o[j + 3] = 255;
    }
  }
  dstCtx.putImageData(img, x0, y0);
}

function clearTarget(T) {
  for (const n of ORDER) T.L[n].fill(0);
  T.fx.clearRect(0, 0, BW, BH);
}

function copyTargetBox(src, dst, box) {
  const [x0, y0, x1, y1] = box;
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return;
  for (const n of ORDER) {
    const s = src.L[n], d = dst.L[n];
    for (let y = y0; y < y1; y++) {
      const off = y * BW;
      d.set(s.subarray(off + x0, off + x1), off + x0);
    }
  }
  dst.fx.clearRect(x0, y0, w, h);
  dst.fx.drawImage(src.fc, x0, y0, w, h, x0, y0, w, h);
}

function renderMarks(t) {
  let k = 0;
  while (k < EL.length && t >= EL[k].t0 + EL[k].d) k++;

  if (lastActiveBoxes.length) {
    for (const [ax0, ay0, ax1, ay1] of lastActiveBoxes) {
      if (ax1 > ax0 && ay1 > ay0) {
        wx.drawImage(CACHE_WC, ax0, ay0, ax1 - ax0, ay1 - ay0, ax0, ay0, ax1 - ax0, ay1 - ay0);
      }
    }
    lastActiveBoxes = [];
  }

  if (cacheK > k) {
    clearTarget(CACHE);
    cacheWx.drawImage(PAPER_WC, 0, 0);
    wx.drawImage(PAPER_WC, 0, 0);
    cacheK = 0;
  }

  if (cacheK < k) {
    TG = CACHE;
    const newlyBoxes = [];
    for (let i = cacheK; i < k; i++) {
      EL[i].apply(1);
      if (EL[i].boxPx) newlyBoxes.push(EL[i].boxPx);
    }
    cacheK = k;
    for (const b of clusterBoxes(newlyBoxes, 28)) {
      compositeRect(CACHE, cacheWx, ...b);
      const [nx0, ny0, nx1, ny1] = b;
      if (nx1 > nx0 && ny1 > ny0) {
        wx.drawImage(CACHE_WC, nx0, ny0, nx1 - nx0, ny1 - ny0, nx0, ny0, nx1 - nx0, ny1 - ny0);
      }
    }
  }

  const active = [];
  const activeBoxes = [];
  for (let i = k; i < EL.length; i++) {
    const e = EL[i];
    if (t >= e.t0) {
      active.push(e);
      if (e.boxPx) activeBoxes.push(e.boxPx);
    }
  }
  if (!active.length || !activeBoxes.length) return;

  const clusters = clusterBoxes(activeBoxes, 28);
  for (const b of clusters) {
    copyTargetBox(CACHE, WORK, b);
    TG = WORK;
    for (const e of active) {
      if (e.boxPx && boxesOverlap(e.boxPx, b, 0)) {
        e.apply(clamp((t - e.t0) / e.d));
      }
    }
    compositeRect(WORK, wx, ...b);
  }
  lastActiveBoxes = clusters;
}

// ---------- Main Frame Renderer ----------
function renderFull(t) {
  const c = cam(t);
  renderMarks(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);

  ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
  ctx.rotate(c.r);
  ctx.scale(c.z / S, c.z / S);
  ctx.translate(-(c.x - X0) * S, -(c.y - Y0) * S);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(WC, 0, 0);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const d of DYN) if (t >= d.t0 && t < d.t1) d.draw(t, c, ctx, toScreen, C);

  // Subtle corner paper vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.96);
  g.addColorStop(0, 'rgba(120,100,80,0)');
  g.addColorStop(1, 'rgba(120,100,80,0.09)');
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  if (CLEAN) return;
  drawStylus(t);
  drawSubs(t);
}

// ---------- Dedicated Cover Thumbnail (?thumb=1) ----------
function renderThumbnailCover() {
  clearTarget(CACHE);
  cacheWx.drawImage(PAPER_WC, 0, 0);
  wx.drawImage(PAPER_WC, 0, 0);
  TG = CACHE;
  EL.length = 0;

  if (typeof window.buildThumbnailMarks === 'function') {
    window.buildThumbnailMarks(SKETCH_API);
  }
  for (const e of EL) e.apply(1);
  compositeRect(CACHE, wx, 0, 0, BW, BH);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, W / 2, H / 2);
  ctx.scale(1 / S, 1 / S);
  ctx.translate(-(540 - X0) * S, -(960 - Y0) * S);
  ctx.drawImage(WC, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.96);
  g.addColorStop(0, 'rgba(120,100,80,0)');
  g.addColorStop(1, 'rgba(120,100,80,0.10)');
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- Exposed API for scenes.js & Studio Runner ----------
const SKETCH_API = {
  W, H, FPS, C,
  PEN, BLOB, OCC, TXT,
  ell, bez, rectPoly, roundRectPoly, circleStroke, arrow, dashedLine, starBurst,
  rnd, clamp, lerp, eio, eo,
  setCAM: arr => { CAM = arr; },
  addDYN: obj => { DYN.push(obj); },
  addSFX: obj => { SFX.push(obj); }
};

window.render = t => {
  if (THUMB) { renderThumbnailCover(); return; }
  renderFull(FROM + t);
};
window.CAMAT = cam;
window.TEXTS = t => {
  if (THUMB) return [];
  t += FROM;
  const c = cam(t), out = [];
  EL.forEach((e, i) => {
    if (e.kind !== 'write' || e.pass || t < e.t0) return;
    if (e.tEnd !== undefined && t > e.tEnd) return;
    const [a, b, cc, d] = e.T.box;
    const cs = [[a, b], [cc, b], [a, d], [cc, d]].map(([x, y]) => toScreen(c, x, y));
    const bb = bbox(cs);
    out.push({ id: 'txt' + i, text: e.T.s, x0: bb[0], y0: bb[1], x1: bb[2], y1: bb[3] });
  });
  return out;
};

async function boot() {
  const [gly, sched, wordsData, linesCfg] = await Promise.all([
    fetch('assets/glyphs.json').then(r => r.json()),
    fetch('voice/schedule.json').then(r => r.json()),
    fetch('voice/words.json').then(r => r.json()),
    fetch('voice/lines.json').then(r => r.json())
  ]);
  GLY = gly;
  await Promise.all([
    document.fonts.load('700 48px CB', 'Ag'),
    document.fonts.load('500 40px CM', 'Ag'),
    document.fonts.load('800 40px PJSB', 'Ag'),
    document.fonts.load('600 20px PJSS', 'Ag')
  ]);
  buildGrain();
  CACHE = mkTarget();
  WORK = mkTarget();
  TG = CACHE;

  window.DUR = Number(sched.total) || 80.01;
  SUB_GROUPS = buildCaptionGroups(wordsData, linesCfg);

  if (THUMB) {
    renderThumbnailCover();
    window.READY = true;
    return;
  }

  R = mulberry(20261122);
  window.buildPage(SKETCH_API, sched, wordsData);
  NIBS = EL.filter(e => e.nib);

  const ev = [];
  for (const e of EL) {
    if (e.t0 < 0 || e.kind === 'occ' || e.kind === 'none') continue;
    const tm = e.t0 + e.d * 0.5;
    const c = cam(tm);
    const p = e.nib ? e.nib(0.5) : (e.wx || [W / 2, H / 2]);
    const pan = clamp((toScreen(c, p[0], p[1])[0] / W) * 2 - 1, -1, 1);
    ev.push({ t: +e.t0.toFixed(4), type: e.kind, d: +e.d.toFixed(4), pan: +pan.toFixed(3) });
  }
  NIBS.forEach((e, i) => {
    if (e.t0 < 0) return;
    let prevEnd = -9;
    for (let j = 0; j < i; j++) {
      const pe = NIBS[j].t0 + NIBS[j].d;
      if (pe > prevEnd) prevEnd = pe;
    }
    if (e.t0 - prevEnd > 0.14) {
      const c = cam(e.t0);
      const p = e.nib(0);
      const pan = clamp((toScreen(c, p[0], p[1])[0] / W) * 2 - 1, -1, 1);
      ev.push({ t: +e.t0.toFixed(4), type: 'tap', d: 0, pan: +pan.toFixed(3) });
    }
  });
  for (let i = 1; i < CAM.length; i++) {
    const a = CAM[i - 1], b = CAM[i];
    if (b.k !== 'g' && b.k !== 'p') continue;
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const zDelta = Math.abs(Math.log((b.z || 1) / (a.z || 1)));
    if (dist > 45 || zDelta > 0.18) {
      ev.push({
        t: +a.t.toFixed(4),
        type: b.k === 'p' ? 'punch' : 'gesture',
        d: +Math.max(0.15, b.t - a.t).toFixed(4),
        pan: +clamp((b.x - a.x) / 600, -0.6, 0.6).toFixed(3)
      });
    }
  }
  for (const s of SFX) {
    if (s.t >= 0 && s.t < window.DUR) {
      ev.push({
        t: +s.t.toFixed(4),
        type: s.type || 'pop',
        d: +(s.d || 0).toFixed(4),
        pan: +clamp(s.pan || 0, -1, 1).toFixed(3)
      });
    }
  }
  ev.sort((a, b) => a.t - b.t);
  window.EV = ev;

  window.render(0);
  window.READY = true;
}
boot();
</script>
