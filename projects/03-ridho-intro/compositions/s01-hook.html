<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #f8fafc; font-family: "Inter", sans-serif; }
    .dot-grid { position: absolute; inset: 0; background-image: radial-gradient(#0a0a0a 1.5px, transparent 1.5px); background-size: 32px 32px; opacity: 0.06; }
    #s01-rope { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 20; }
    #s01-card { position: absolute; left: 0; top: 0; width: 448px; transform-origin: 50% 0%; z-index: 10; background: #ffffff; border: 2px solid #e5e5e5; border-radius: 34px; padding: 14px; box-shadow: 0 36px 76px rgba(10, 10, 10, 0.16); }
    #s01-card img { display: block; width: 100%; height: auto; border-radius: 24px; }
    .debug-panel { position: absolute; left: 88px; right: 88px; top: 1125px; background: #0a0a0a; color: #ffffff; border-radius: 34px; padding: 32px 38px; box-shadow: 0 26px 56px rgba(10, 10, 10, 0.18); display: flex; flex-direction: column; gap: 18px; z-index: 25; }
    .debug-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .anchor-text { font-size: 42px; font-weight: 900; letter-spacing: -0.025em; line-height: 1.12; }
    .status-pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: #1c1c1c; border: 1px solid #383838; font-size: 28px; font-weight: 700; white-space: nowrap; }
    .live-dot { width: 12px; height: 12px; border-radius: 999px; background: #10b981; }
    .wave-box { background: #141414; border: 1px solid #2a2a2a; border-radius: 22px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .formula-txt { font-size: 28px; font-weight: 700; color: #d4d4d4; font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
    <div class="dot-grid" data-layout-ignore="true"></div>
    <canvas id="s01-rope" width="1080" height="1920" data-layout-ignore="true"></canvas>
    <div id="s01-card" data-layout-ignore="true">
      <img src="assets/asn-card-front-masked.png" alt="Kartu Identitas Lanyard" />
    </div>
    <div id="s01-panel" class="debug-panel">
      <div class="debug-top">
        <div class="anchor-text">Bukan marah. Lagi debugging.</div>
        <span class="status-pill"><span class="live-dot"></span>ISTJ-A</span>
      </div>
      <div class="wave-box">
        <svg width="460" height="72" viewBox="0 0 460 72" fill="none" data-layout-ignore="true">
          <path d="M0 36 L460 36" stroke="#2e2e2e" stroke-width="2" />
          <path id="s01-wave" d="M0 36 Q 38 6, 76 36 T 152 36 T 228 36 T 304 36 T 380 36 T 456 36" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="0" />
        </svg>
        <div class="formula-txt">f(t) = Rumus / Otomasi</div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById("s01-rope");
      const card = document.getElementById("s01-card");
      const ctx = canvas.getContext("2d");
      const W = 1080, cw = 448, sw = 48, ringR = 18;
      const ch = Math.round(cw * 1.56);
      const lowLen = sw * 1.9;
      const clipH = Math.round(cw * 0.11);
      const arm = ringR * 2 + clipH + ch * 0.55;
      const N = 14, STEP = 1 / 120, GRAVITY = 2400, ITER = 18;

      const pts = [];
      const links = [];
      const add = (x, y, w) => { pts.push({ x, y, px: x, py: y, w }); return pts.length - 1; };
      const strand = (from, to, n, slack) => {
        const a = pts[from], b = pts[to];
        const rest = (Math.hypot(b.x - a.x, b.y - a.y) * slack) / n;
        const ids = [from];
        for (let i = 1; i < n; i++) ids.push(add(a.x + ((b.x - a.x) * i) / n, a.y + ((b.y - a.y) * i) / n, 1));
        ids.push(to);
        for (let i = 0; i < n; i++) links.push([ids[i], ids[i + 1], rest]);
        return { ids, rest };
      };

      const cx = W / 2, spread = 192, top = -sw * 1.2, bY = 235;
      const aL = add(cx - spread, top, 0);
      const iB = add(cx, bY, 1.4);
      const l = strand(aL, iB, N, 1.03);
      const aR = add(cx + spread, top, 0);
      const r = strand(aR, iB, N, 1.03);
      const iT = add(cx, bY + lowLen, 0.8);
      const lo = strand(iB, iT, 3, 1);
      const iC = add(cx, bY + lowLen + arm, 0.25);
      links.push([iT, iC, arm]);

      // Initial swing offset like portfolio LanyardBadge
      pts[iC].x += 165;
      pts[iC].px = pts[iC].x - 1.8;
      const spin = { a: 0.18, v: 2.6 };

      function drawHoneycomb(c2, startX, endX, width) {
        const rad = width * 0.22, dx = rad * 1.5, dy = rad * Math.sqrt(3);
        c2.save(); c2.beginPath(); c2.rect(startX, 0, endX - startX, width); c2.clip();
        c2.lineWidth = Math.max(1, width * 0.035); c2.strokeStyle = "#525252";
        let col = 0;
        for (let x = startX; x <= endX + rad; x += dx, col++) {
          const prog = Math.max(0, Math.min(1, (x - startX) / Math.max(1, endX - startX)));
          c2.globalAlpha = 0.14 + prog * 0.55;
          const yOff = (col % 2) * (dy / 2);
          for (let y = -rad + yOff; y <= width + rad; y += dy) {
            c2.beginPath();
            for (let s = 0; s < 6; s++) {
              const ang = (s / 6) * Math.PI * 2;
              const hx = x + Math.cos(ang) * rad * 0.92, hy = y + Math.sin(ang) * rad * 0.92;
              if (s === 0) c2.moveTo(hx, hy); else c2.lineTo(hx, hy);
            }
            c2.closePath(); c2.stroke();
          }
        }
        c2.restore();
      }

      function makeStrap(len, wid, plain) {
        const c = document.createElement("canvas");
        c.width = Math.round(wid); c.height = Math.round(len);
        const c2 = c.getContext("2d");
        c2.setTransform(0, 1, -1, 0, c.width, 0);
        c2.fillStyle = "#0a0a0a"; c2.fillRect(0, 0, len, wid);
        if (!plain) drawHoneycomb(c2, len * 0.25, len, wid);
        c2.globalAlpha = 0.28; c2.strokeStyle = "#525252"; c2.lineWidth = 1.5;
        c2.beginPath(); c2.moveTo(0, 2); c2.lineTo(len, 2); c2.moveTo(0, wid - 2); c2.lineTo(len, wid - 2); c2.stroke();
        return c;
      }

      const strapTex = makeStrap(l.rest * N + 8, sw, false);
      const plainTex = makeStrap(lowLen + 8, sw * 0.84, true);

      // Pre-compute 800 deterministic Verlet physics steps (0..6.66s @ 120 Hz)
      const frames = [];
      for (let step = 0; step <= 800; step++) {
        frames.push({
          pts: pts.map((p) => ({ x: p.x, y: p.y })),
          spinA: spin.a,
        });
        const tSim = step * STEP;
        const C = pts[iC];
        C.x += (22 * Math.sin(tSim * 0.7) + 10 * Math.sin(tSim * 1.9)) * STEP * STEP;
        for (const p of pts) {
          if (!p.w) continue;
          const vx = (p.x - p.px) * 0.992, vy = (p.y - p.py) * 0.992;
          p.px = p.x; p.py = p.y;
          p.x += vx; p.y += vy + GRAVITY * STEP * STEP;
        }
        for (let k = 0; k < ITER; k++) {
          for (const [i, j, rest] of links) {
            const a = pts[i], b = pts[j], ws = a.w + b.w;
            if (!ws) continue;
            const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
            const f = (d - rest) / (d * ws);
            a.x += dx * f * a.w; a.y += dy * f * a.w;
            b.x -= dx * f * b.w; b.y -= dy * f * b.w;
          }
        }
        const vx = (C.x - C.px) / STEP;
        spin.v += (-(spin.a - 0) * 18 - spin.v * 3.2 + (vx * 0.012 + 0.32 * Math.sin(tSim * 0.5))) * STEP;
        spin.a += spin.v * STEP;
      }

      const drawRibbon = (snap, ids, tex, rest, light) => {
        const Wt = tex.width;
        for (let i = 0; i < ids.length - 1; i++) {
          const a = snap[ids[i]], b = snap[ids[i + 1]];
          const dx = b.x - a.x, dy = b.y - a.y, ln = Math.hypot(dx, dy) || 1e-6;
          const tx = dx / ln, ty = dy / ln, nx = ty, ny = -tx;
          const v0 = i * rest, dv = rest, k = ln / dv;
          ctx.setTransform(nx, ny, tx * k, ty * k, a.x - (nx * Wt) / 2 - tx * k * v0, a.y - (ny * Wt) / 2 - ty * k * v0);
          const src = Math.min(dv + 1.5, tex.height - v0);
          if (src > 0) ctx.drawImage(tex, 0, v0, Wt, src, 0, v0, Wt, src);
          ctx.fillStyle = `rgba(0,0,0,${(0.22 * (1 - Math.max(0, nx * light))).toFixed(3)})`;
          ctx.fillRect(0, v0, Wt, dv + 1);
        }
      };

      const renderVerletAt = (tSec) => {
        const idx = Math.max(0, Math.min(frames.length - 1, Math.round(tSec * 120)));
        const st = frames[idx];
        const snap = st.pts;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, 1080, 1920);
        drawRibbon(snap, l.ids, strapTex, l.rest, -1);
        drawRibbon(snap, r.ids, strapTex, r.rest, 1);
        drawRibbon(snap, lo.ids, plainTex, lowLen / 3, 0);

        const B = snap[iB], T = snap[iT], C = snap[iC];
        const ang = Math.atan2(T.x - B.x, T.y - B.y), u = sw / 20;
        ctx.setTransform(1, 0, 0, 1, B.x, B.y);
        ctx.rotate(-ang);
        ctx.fillStyle = "#171717"; ctx.strokeStyle = "#525252"; ctx.lineWidth = 1.2 * u;
        ctx.beginPath(); ctx.roundRect(-14 * u, -17 * u, 28 * u, 20 * u, 3.5 * u); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.roundRect(-11 * u, 2 * u, 22 * u, 16 * u, [2 * u, 2 * u, 5 * u, 5 * u]); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#0a0a0a"; ctx.beginPath(); ctx.arc(0, -4 * u, 6.2 * u, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.setTransform(1, 0, 0, 1, T.x, T.y + ringR * 0.8);
        const g = ctx.createLinearGradient(-ringR, -ringR, ringR, ringR);
        g.addColorStop(0, "#f8fafc"); g.addColorStop(0.5, "#737373"); g.addColorStop(1, "#e5e5e5");
        ctx.lineWidth = 6.5; ctx.strokeStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI * 2); ctx.stroke();

        const swing = Math.atan2(C.x - T.x, C.y - T.y);
        card.style.transform = `translate3d(${(T.x - cw / 2).toFixed(2)}px, ${(T.y + ringR).toFixed(2)}px, 0) rotate(${(-swing).toFixed(4)}rad) perspective(1100px) rotateY(${st.spinA.toFixed(4)}rad)`;
      };

      renderVerletAt(0);
      const proxy = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(proxy, { t: 0 }, { t: 6.488, duration: 6.488, ease: "none", onUpdate: () => renderVerletAt(proxy.t) }, 0);
      tl.fromTo("#s01-panel", { y: 18, opacity: 0.94 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#s01-wave", { strokeDashoffset: 460 }, { strokeDashoffset: 0, duration: 3.4, ease: "power2.inOut" }, 0.4);
      tl.to(["#s01-panel", "#s01-card", "#s01-rope"], { opacity: 0, duration: 0.28, ease: "power3.in" }, 6.18);

      window.__timelines = window.__timelines || {};
      window.__timelines["s01-hook"] = tl;
    })();
  </script>
</template>
